<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- BASIC -->
<title>Fractal Lab</title>
<meta name="description" content="Interactive spinning fractal generator. Click mutate to create new forms.">

<!-- OPEN GRAPH (Discord, Facebook, etc.) -->
<meta property="og:title" content="Spinning Fractal Lab">
<meta property="og:description" content="Procedural fractal generator with real-time rotation.">
<meta property="og:type" content="website">
<meta property="og:url" content="">
<meta property="og:image" content="002.png">

<!-- TWITTER -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Spinning Fractal Lab">
<meta name="twitter:description" content="Procedural fractal generator with real-time rotation.">
<meta name="twitter:image" content="002.png">
<link id="favicon" rel="icon">
<style>
body { margin:0; overflow:hidden; background:#05070a; }
canvas { display:block; }
.ui {
  position:fixed; top:20px; left:20px; display:flex; gap:10px;
}
button {
  padding:10px; background:#111; color:#0ff;
  border:1px solid #0ff; cursor:pointer;
}
</style>
</head>
<body>

<div class="ui">
  <button id="mutateBtn">Mutate</button>
  <button id="saveBtn">Save</button>
  <button id="copyBtn">Copy Link</button>
</div>

<canvas id="canvas"></canvas>

<script>
// ---------- RNG ----------
function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t>>>15, t|1);
    t ^= t + Math.imul(t ^ t>>>7, t|61);
    return ((t ^ t>>>14)>>>0)/4294967296;
  }
}

// ---------- URL seed ----------
function getSeed(){
  return new URL(location.href).searchParams.get("seed");
}
function setSeed(seed){
  const url = new URL(location.href);
  url.searchParams.set("seed", seed);
  history.replaceState({}, "", url);
}

// ---------- canvas ----------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const buffer = document.createElement("canvas");
const bctx = buffer.getContext("2d");

// ---------- fractal ----------
class FractLab {
  constructor(rand){
    this.rand = rand;
    this.lineWidth = Math.floor(rand()*8)+4;
    this.hue = rand()*360;
    this.sides = Math.floor(rand()*5)+2;
    this.maxLevel = 6;
    this.spread = rand()*0.5+0.4;

    this.scale = rand()*0.15+0.65;
    this.branches = 4;
    this.branchSize = 150;

    const last = this.branches-1;
    const sf = this.spread*5;

    this.chaos = last-(this.branches-sf+rand()*0.75);
    this.symmetry = last-(this.branches-sf)*0.5;

    this.tau = Math.PI*2;
  }

  render(ctx){
    ctx.clearRect(0,0,buffer.width,buffer.height);

    ctx.save();
    ctx.setTransform(1,0,0,1,0,0); // IMPORTANT RESET
    ctx.lineCap="round";
    ctx.lineWidth=this.lineWidth;

    ctx.translate(buffer.width/2, buffer.height/2);

    for(let i=0;i<this.sides;i++){
      this.branch(ctx,0);
      ctx.rotate(this.tau/this.sides);
    }

    ctx.restore();
  }

  branch(ctx, level){
    if(level>this.maxLevel) return;

    ctx.strokeStyle = `hsl(${this.hue},70%,${20+level*10}%)`;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(this.branchSize,0);
    ctx.stroke();

    for(let i=0;i<this.branches;i++){
      const pos = this.branchSize-(this.branchSize/this.branches)*i;

      ctx.save();
      ctx.translate(pos,0);
      ctx.scale(this.scale,this.scale);
      ctx.rotate(
        (this.spread*this.symmetry*i)/this.branches -
        this.spread*this.chaos
      );
      this.branch(ctx, level+1);
      ctx.restore();
    }
  }
}

// ---------- state ----------
let seed = getSeed() || Math.floor(Math.random()*1e9).toString();
setSeed(seed);

let rand = mulberry32(Number(seed));
let fractal = new FractLab(rand);
let rotation = 0;

// ---------- render loop ----------
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.shadowColor="rgba(0,0,0,0.5)";
  ctx.shadowBlur=12;

  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.rotate(rotation);

  ctx.drawImage(buffer, -buffer.width/2, -buffer.height/2);

  ctx.restore();
}

function animate(){
  rotation+=0.01;
  draw();
  requestAnimationFrame(animate);
}

// ---------- resize ----------
function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;

  const diag = Math.sqrt(canvas.width**2 + canvas.height**2);

  buffer.width = diag;
  buffer.height = diag;

  fractal.render(bctx);
  updateFavicon();
}

window.addEventListener("resize", resize);

// ---------- favicon ----------
function updateFavicon(){
  const icon = document.createElement("canvas");
  const ictx = icon.getContext("2d");

  icon.width = 64;
  icon.height = 64;

  ictx.fillStyle="#05070a";
  ictx.fillRect(0,0,64,64);

  const scale = 64 / buffer.width;

  ictx.save();
  ictx.translate(32,32);
  ictx.scale(scale*1.8, scale*1.8);
  ictx.drawImage(buffer, -buffer.width/2, -buffer.height/2);
  ictx.restore();

  document.getElementById("favicon").href = icon.toDataURL();
}

// ---------- controls ----------
mutateBtn.onclick = ()=>{
  seed = Math.floor(Math.random()*1e9).toString();
  setSeed(seed);

  rand = mulberry32(Number(seed));
  fractal = new FractLab(rand);

  fractal.render(bctx);
  updateFavicon();
};

saveBtn.onclick = ()=>{
  const a = document.createElement("a");
  a.href = buffer.toDataURL("image/png");
  a.download = `fract-${seed}.png`;
  a.click();
};

copyBtn.onclick = ()=>navigator.clipboard.writeText(location.href);

// ---------- init ----------
resize();
animate();
</script>

</body>
</html>
